<IfModule mod_ssl.c>
    <VirtualHost _default_:443>
        ServerAdmin admin@cybersecurity-lab.local
        ServerName www.cybersec-lab.local
        ServerAlias cybersec-lab.local

        DocumentRoot /var/www/html

        ErrorLog ${APACHE_LOG_DIR}/error.log
        CustomLog ${APACHE_LOG_DIR}/access.log combined

        SSLEngine on
        SSLCertificateFile /etc/ssl/certs/webserver.crt
        SSLCertificateKeyFile /etc/ssl/private/webserver.key
        SSLCertificateChainFile /etc/ssl/certs/ca.crt

        <FilesMatch "\.(cgi|shtml|phtml|php)$">
            SSLOptions +StdEnvVars
        </FilesMatch>
        <Directory /usr/lib/cgi-bin>
            SSLOptions +StdEnvVars
        </Directory>
    </VirtualHost>
</IfModule>
